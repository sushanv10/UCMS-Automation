[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    smoke: Smoke tests
    login: Login module tests
    navbar: NavBar module tests
    network_explorer: Network Explorer module tests
    add_region: Add Region module tests
    region_details: Region Details module tests
    regression: Full regression suite

# Default options
addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --browser chromium

# Timeout (seconds) for each test
timeout = 60

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
